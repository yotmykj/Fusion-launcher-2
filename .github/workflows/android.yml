name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Скачиваем репозиторий ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Настраиваем Java 17 (нужна для новых версий Android) ────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Полная зачистка и принудительное создание Wrapper 8.7 ──────────
      - name: Force Fix Gradle Wrapper
        run: |
          # Полностью удаляем старые поломанные файлы
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          
          # Устанавливаем чистый Gradle в систему Ubuntu
          sudo apt-get update
          sudo apt-get install -y gradle
          
          # Создаем с нуля официальный Gradle Wrapper версии 8.7 (требуется для AGP 8.5.2)
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          
          # Очищаем возможный мусор в тексте скрипта
          sed -i 's/"-Xmx64m"//g' gradlew || true
          
          # Даем права на запуск
          chmod +x gradlew

      # ── 4. Сборка проекта ──────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      # ── 5. Сохранение готового APK в артефакты ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fusion-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 6. Проверка размера файла ──────────────────────────────────────────
      - name: Show APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK built successfully — size: $SIZE"
          else
            echo "❌ APK not found"
            exit 1
          fi
