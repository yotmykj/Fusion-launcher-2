name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Полная зачистка и принудительное обновление Wrapper ──────────────
      - name: Force Fix Gradle Wrapper
        run: |
          # Уничтожаем старые файлы
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          
          # Устанавливаем чистый Gradle в саму систему Ubuntu
          sudo apt-get update
          sudo apt-get install -y gradle
          
          # Генерируем абсолютно новые официальные файлы
          gradle wrapper --gradle-version 8.0 --distribution-type bin
          
          # Проверяем, что внутри gradlew нет мусора "-Xmx64m"
          sed -i 's/"-Xmx64m"//g' gradlew || true
          
          # Выдаем права
          chmod +x gradlew

      # ── 4. Сборка с очисткой кэша (чтобы старый баг не вернулся) ───────────
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      # ── 5. Сохранение APK ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fusion-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 6. Проверка результата ─────────────────────────────────────────────
      - name: Show APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK built successfully — size: $SIZE"
          else
            echo "❌ APK not found"
            exit 1
          fi
