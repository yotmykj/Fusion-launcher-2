name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Скачиваем репозиторий ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Настраиваем Java 17 ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. УЛЬТРА-ФИКС КОНФИГУРАЦИЙ ПРОЕКТА ────────────────────────────────
      - name: Total Configuration Override
        run: |
          # 1. Стираем битый Gradle Wrapper от Claude
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          
          # 2. Ставим чистый Gradle в систему Ubuntu
          sudo apt-get update && sudo apt-get install -y gradle
          
          # 3. Генерируем правильный Wrapper версии 8.7
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          
          # 4. Гарантированно включаем AndroidX в gradle.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 5. ГЛОБАЛЬНЫЙ ПЕРЕХВАТ ЗАВИСИМОСТЕЙ (Самый надежный фикс)
          # Этот скрипт дописывает в корень проекта правило: если Gradle ищет любую alpha-версию 
          # библиотек tv-material или tv-foundation, он ПРИНУДИТЕЛЬНО скачает стабильную версию 1.0.0.
          # Это сработает, даже если версии запрятаны глубоко в TOML каталогах.
          cat << 'EOF' >> build.gradle.kts
          
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "androidx.tv") {
                          useVersion("1.0.0")
                          because("Force update buggy alpha versions from Claude to stable release")
                      }
                  }
              }
          }
          EOF

      # ── 4. Сборка проекта ──────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      # ── 5. Сохранение готового APK ─────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fusion-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 6. Проверка размера файла ──────────────────────────────────────────
      - name: Show APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK успешно собран! Размер файла: $SIZE"
          else
            echo "❌ APK не найден"
            exit 1
          fi
